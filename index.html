<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171b2d">
  <meta name="description" content="NOKVA — 小さなブラウザゲームの作品集。ひと息つけるパズル『いろの庭』をお楽しみください。">
  <title>NOKVA</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="games.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#games">ゲーム一覧へ移動</a>
  <main>
    <h1 class="sr-only">NOKVA</h1>

    <section class="garden" aria-label="月光に照らされた夜の庭園">
      <div class="garden-frame">
        <img class="garden-image" src="assets/nokva-main.webp" width="1672" height="941" alt="NOKVA — Small games, little worlds. 紺と金の切り絵の庭。月明かりの水面に金魚が泳ぎ、白い花と灯籠が彩る。" fetchpriority="high" decoding="async">
      </div>
      <div class="garden-caption"><span class="caption-line" aria-hidden="true"></span><p>小さな遊びから、ひらく世界。</p><span class="caption-line" aria-hidden="true"></span></div>
    </section>

    <section id="games" class="collection" aria-labelledby="games-heading">
      <div class="section-heading"><div><p class="eyebrow">THE COLLECTION</p><h2 id="games-heading">庭に集う、小さな世界</h2></div><span class="heading-star" aria-hidden="true">✧</span></div>
      <div id="game-grid" class="game-grid">
        <a class="game-card playable" href="https://yanntinn.github.io/iro-no-niwa/" aria-label="いろの庭を遊ぶ">
          <div class="card-visual scene-pair"><img src="assets/iro-no-niwa.svg" alt="『いろの庭』の夜明けの丘。淡い朝焼けと曲がりくねる小径。" width="600" height="600" loading="lazy"><img src="assets/iro-no-niwa-moon.svg" alt="『いろの庭』の月のしずく。三日月が輝く静かな湖。" width="600" height="600" loading="lazy"><span class="scene-number" aria-hidden="true">01</span></div>
          <div class="card-content"><div class="game-label"><span>IRO NO NIWA</span><span class="genre">パズルゲーム</span></div><h3>いろの庭</h3><p class="game-description">色をつないで、景色がひらく。<br>時間に追われない、小さなパズル。</p><div class="card-bottom"><span class="play-label">PLAY NOW</span><span class="play-arrow" aria-hidden="true">↗</span></div></div>
        </a>
        <article class="game-card forthcoming" aria-label="次のゲームは準備中です">
          <div class="card-visual coming-visual" aria-hidden="true"><svg viewBox="0 0 600 300" fill="none"><path d="M0 238Q150 211 300 238T600 238M50 254Q197 230 350 253T620 252" stroke="currentColor" opacity=".2"/><path d="M300 83Q303 132 331 136Q303 141 300 189Q297 141 269 136Q297 132 300 83Z" stroke="currentColor" stroke-width=".7"/><circle cx="300" cy="136" r="62" stroke="currentColor" stroke-width=".5" opacity=".25"/><path d="M182 92h6m-3 -3v6M419 171h7m-3.5 -3.5v7M395 73h4m-2 -2v4" stroke="currentColor" opacity=".5"/></svg><span class="scene-number">02</span></div>
          <div class="card-content"><div class="game-label"><span>A WORLD TO COME</span><span class="genre">準備中</span></div><h3 class="coming-title" lang="en">Coming soon</h3><p class="game-description">まだ見ぬ景色と、新しい遊び。<br>次の小さな世界を、お楽しみに。</p><div class="card-bottom"><span class="coming-label">COMING SOON</span><span class="quiet-star" aria-hidden="true">✧</span></div></div>
        </article>
      </div>
    </section>
    <footer><span aria-hidden="true">✧</span><p>© NOKVA</p></footer>
  </main>
</body>
</html>
